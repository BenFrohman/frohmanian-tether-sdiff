# Author: Benjamin Stanley Frohman
# Truth Gate (see TRUTH_GATE.md): lake build + scripts/verify-lock.sh.
name: truth-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Collect lake certificate environment
        if: always()
        run: bash scripts/collect_lake_certificate.sh cert-bundle
      - name: Mathlib cache
        run: lake exe cache get
      - name: lake build
        run: |
          set -o pipefail
          mkdir -p cert-bundle
          lake build 2>&1 | tee cert-bundle/lake-build.log
      - name: verify-lock
        run: bash scripts/verify-lock.sh
      - name: Finalize certificate bundle
        if: always()
        run: bash scripts/finalize_lake_certificate.sh cert-bundle
      - name: Upload lake certificate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-certificate-truth-gate-${{ github.event_name }}-${{ github.run_id }}
          path: cert-bundle/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-gate-report
          path: truth-gate-report/
