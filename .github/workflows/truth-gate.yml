# Truth Gate (see TRUTH_GATE.md, "Failure classes"):
#   lock-form-lint  static lint of paper_claim + classifier fixtures (every PR, no Lean)
#   truth-gate      stale-base check, lake build + scripts/verify-lock.sh, classified verdict
name: truth-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-form-lint:
    name: lock-form-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock-form lint (paper_claim must not reuse repository Props)
        run: python3 scripts/truth_gate_classify.py lint --fetch-deps
      - name: Classifier fixtures (one per failure class)
        run: python3 -m unittest discover -s scripts/tests -p 'test_truth_gate_classify.py' -v

  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stale-base check (judge the PR head merged onto the current base)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/truth_gate_classify.py stale-base --base-ref "$BASE_REF" --head "$PR_HEAD" --fetch --remerge
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Collect lake certificate environment
        if: always()
        run: bash scripts/collect_lake_certificate.sh cert-bundle
      - name: Mathlib cache (Mathlib is never rebuilt here)
        run: lake exe cache get
      - name: lake build (log kept for the certificate bundle; verify-lock classifies any failure)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p cert-bundle
          lake build 2>&1 | tee cert-bundle/lake-build.log
      - name: verify-lock (every phase runs; classified TRUTH GATE VERDICT at the end)
        run: bash scripts/verify-lock.sh
      - name: Finalize certificate bundle
        if: always()
        run: bash scripts/finalize_lake_certificate.sh cert-bundle
      - name: Upload lake certificate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-certificate-truth-gate-${{ github.event_name }}-${{ github.run_id }}
          path: cert-bundle/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-gate-report
          path: truth-gate-report/
