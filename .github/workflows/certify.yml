name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.30.0-rc1)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: No sorry / admit / native_decide / axiom declarations in the sources
        run: python3 scripts/check_no_sorry.py
      - name: Strict axiom audit (fails on any axiom beyond propext, Classical.choice, Quot.sound)
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axioms.txt
      - name: Check audit summary
        run: |
          grep -q "^AUDIT PASS" axioms.txt
          if grep -v "^AUDIT PASS" axioms.txt | grep -qE "AUDIT FAIL|sorryAx|ofReduceBool|error"; then cat axioms.txt; exit 1; fi
          grep "^AUDIT SUMMARY" axioms.txt
      - name: One-command verification (scripts/verify.sh, as documented in README and paper)
        run: bash scripts/verify.sh
      - name: Build the Scratch modules behind the paper's main theorem (10.5281/zenodo.24152113, Appendix B)
        run: |
          set -o pipefail
          lake build Scratch.FeffermanSchwartz Scratch.FeffermanSobolev Scratch.GradBound Scratch.HeatSobolev Scratch.InverseSobolev Scratch.LerayHeat Scratch.LogBoundLocal Scratch.MildExistence Scratch.NonlinearHm Scratch.ProductHm Scratch.R3BKMContinuation Scratch.SobolevFourier Scratch.TetherRateCounterexample Scratch.TetherRateDerivation Scratch.TetherRateLipschitz Scratch.RepairedTetherRate Scratch.VorticityMaxAttained 2>&1 | tee build-rate.log
      - name: '#print axioms for all 69 Appendix B theorems (only propext, Classical.choice, Quot.sound allowed)'
        run: |
          set -o pipefail
          lake env lean scripts/PrintRateAxioms.lean 2>&1 | tee axioms-rate.raw.txt
          python3 scripts/check_rate_axioms.py axioms-rate.raw.txt | tee axioms-rate.txt
      - name: Kernel re-check (leanchecker) of the Appendix B modules
        run: |
          set -o pipefail
          LC="$(dirname "$(elan which lean)")/leanchecker"
          for m in Scratch.FeffermanSchwartz Scratch.FeffermanSobolev Scratch.GradBound Scratch.HeatSobolev Scratch.InverseSobolev Scratch.LerayHeat Scratch.LogBoundLocal Scratch.MildExistence Scratch.NonlinearHm Scratch.ProductHm Scratch.R3BKMContinuation Scratch.SobolevFourier Scratch.TetherRateCounterexample Scratch.TetherRateDerivation Scratch.TetherRateLipschitz Scratch.RepairedTetherRate Scratch.VorticityMaxAttained FrohmanianTether.TetheredLyapunov FrohmanianTether.StrainBoundRefutation; do
            lake env "$LC" "$m" && echo "leanchecker $m: exit 0" || { echo "leanchecker $m: FAILED"; exit 1; }
          done 2>&1 | tee leanchecker-rate.txt
      - name: Upload axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axioms
          path: |
            axioms.txt
            print_axioms.txt
            build-rate.log
            axioms-rate.raw.txt
            axioms-rate.txt
            leanchecker-rate.txt
