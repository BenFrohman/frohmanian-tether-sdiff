name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

# One in-flight certificate per branch, whether triggered by push or pull_request.
# Prevents a redundant push run and a PR run from racing on the same SHA
# (and from colliding on artifact names).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.30.0-rc1)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: No sorry / admit / native_decide / axiom declarations in the sources
        run: python3 scripts/check_no_sorry.py
      - name: Strict axiom audit (fails on any axiom beyond propext, Classical.choice, Quot.sound)
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axioms.txt
      - name: Check audit summary
        run: |
          grep -q "^AUDIT PASS" axioms.txt
          if grep -v "^AUDIT PASS" axioms.txt | grep -qE "AUDIT FAIL|sorryAx|ofReduceBool|error"; then cat axioms.txt; exit 1; fi
          grep "^AUDIT SUMMARY" axioms.txt
      - name: One-command verification (scripts/verify.sh, as documented in README and paper)
        run: bash scripts/verify.sh
      # Upload is bookkeeping only. The Lean/axiom steps above remain required and
      # fail the job on any kernel or audit failure. A GitHub artifact-API outage
      # (HTML error page instead of JSON, as in run 43093930648) must not fail a
      # already-certified build.
      - name: Upload axiom report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: axioms-${{ github.event_name }}-${{ github.run_id }}
          path: |
            axioms.txt
            print_axioms.txt
          if-no-files-found: warn
          overwrite: true
