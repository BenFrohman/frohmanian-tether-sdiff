name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.30.0-rc1)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Build Scratch
        run: |
          lake build Scratch
          echo "Built Scratch (every Scratch/*.lean module)"
      - name: No sorry / admit / native_decide / axiom declarations in the sources
        run: python3 scripts/check_no_sorry.py
      - name: Strict axiom audit (fails on any axiom beyond propext, Classical.choice, Quot.sound)
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axioms.txt
      - name: Check audit summary
        run: |
          grep -q "^AUDIT PASS" axioms.txt
          if grep -v "^AUDIT PASS" axioms.txt | grep -qE "AUDIT FAIL|sorryAx|ofReduceBool|error"; then cat axioms.txt; exit 1; fi
          grep "^AUDIT SUMMARY" axioms.txt
      - name: Scratch axiom audit (headline Scratch theorems)
        run: |
          set -o pipefail
          lake env lean scripts/PrintScratchAxioms.lean 2>&1 | tee scratch_axioms.txt
      - name: Check Scratch axiom audit
        run: |
          grep -q "^SCRATCH AUDIT PASS" scratch_axioms.txt
          if grep -v "^SCRATCH AUDIT PASS" scratch_axioms.txt | grep -qE "SCRATCH AUDIT FAIL|sorryAx|ofReduceBool|error"; then cat scratch_axioms.txt; exit 1; fi
          grep "^SCRATCH AUDIT SUMMARY" scratch_axioms.txt
      - name: One-command verification (scripts/verify.sh, as documented in README and paper)
        run: bash scripts/verify.sh
      - name: Upload axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axioms
          path: |
            axioms.txt
            print_axioms.txt
            scratch_axioms.txt
